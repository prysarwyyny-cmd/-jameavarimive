گیم‌پلی

بعد از پایان شمارش معکوس:

- پایین صفحه یک سطل زیبا قرار بگیرد.
- میوه‌ها به صورت تصادفی از بالای صفحه ظاهر شوند.
- میوه‌ها آرام و روان به سمت پایین حرکت کنند.
- بازیکن با لمس و کشیدن انگشت (Drag) یا حرکت موس، سطل را به چپ و راست حرکت دهد.
- حرکت سطل بسیار نرم باشد.
- سطل از صفحه خارج نشود.

