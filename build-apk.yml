ذخیره رکورد

- رکورد با LocalStorage ذخیره شود.
- اگر برای اولین بار رکوردی وجود نداشت، مقدار اولیه آن ۰ باشد و همان مقدار ذخیره و نمایش داده شود.
- بعد از بستن مرورگر نیز باقی بماند.

