name: ساخت APK

on:
  workflow_dispatch:

jobs:
  build:
    name: ساخت بازی اندروید
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: نصب ابزارهای اندروید
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018'

      - name: آماده‌سازی SDL2
        run: bash scripts/setup_sdl.sh

      - name: ساخت APK
        run: gradle assembleDebug --no-daemon

      - name: آماده‌سازی فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: FruitCollector-APK
          path: app/build/outputs/apk/debug/app-debug.apkپرامپت حرفه‌ای برای ساخت بازی جمع‌آوری میوه (رابط کاربری کاملاً فارسی)

تو یک توسعه‌دهنده حرفه‌ای بازی‌های تحت وب هستی. یک

- جهت نمایش: راست‌به‌چپ (RTL)
- فونت پیشنهادی: Vazirmatn یا IRANSans
- طراحی مدرن، رنگارنگ و مناسب همه سنین.
- بازی روی موبایل و دسکتاپ کاملاً ریسپانسیو باشد.
- کدنویسی تمیز، حرفه‌ای و کامنت‌گذاری شده.
- از HTML، CSS و JavaScript (Canvas API) استفاده شود.
- هیچ کتابخانه اضافی استفاده نشود مگر در صورت نیاز.

