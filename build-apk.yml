خروجی مورد انتظار

یک بازی کامل، حرفه‌ای، زیبا، روان و بدون باگ با رابط کاربری کاملاً فارسی که تجربه‌ای جذاب برای کاربران ایرانی ایجاد کند و تمامی قابلیت‌های بالا را به‌صورت کامل پیاده‌سازی نماید.
 



